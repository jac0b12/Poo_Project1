plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'info.solidsoft.pitest' version '1.19.0'
	id 'org.sonarqube' version '7.5.0.8588'
}
group = 'dot.turnos'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	runtimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	pitest 'org.pitest:pitest-junit5-plugin:1.2.1'
}

pitest {
	pitestVersion = '1.19.0'
	junit5PluginVersion = '1.2.1'

	targetClasses = ['dot.turnos.*'] // Ajusta al paquete raíz de tu código
	targetTests = ['dot.turnos.*']   // Ajusta al paquete de tus tests

	threads = 4
	outputFormats = ['HTML']
	timestampedReports = false
}


tasks.named('test') {
	useJUnitPlatform()

}

sonar {
	properties {
		property 'sonar.projectKey', 'demo-calidad'
		property 'sonar.projectName', 'Proyecto Demo Calidad'
		property 'sonar.host.url', 'http://localhost:9000'
	}
}



